services:
  portfolio_website:
    build: .
    container_name: portfolio_website
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
    volumes:
      - ./logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio_website.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.portfolio_website.entrypoints=websecure"
      - "traefik.http.routers.portfolio_website.tls.certresolver=le"
      - "traefik.http.services.portfolio_website.loadbalancer.server.port=${PORT}"
      - "traefik.http.middlewares.portfolio_website-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.portfolio_website-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.portfolio_website-hsts.headers.stsPreload=true"
      - "traefik.http.routers.portfolio_website.middlewares=portfolio_website-hsts@docker"
    networks:
      - web
    expose:
      - "${PORT}"

networks:
  web:
    external: true
